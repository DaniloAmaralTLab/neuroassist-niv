# Profile 'test' -- Testcontainers (PostgreSQL) + Spring Security test helpers.
# DataSource overridden via @DynamicPropertySource in BaseIntegrationTest.
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/.well-known/jwks.json
eureka:
  client:
    enabled: false
# Feign URL stubs (D-533 -- prevents eager placeholder resolution at test context load)
'neuroassist.hist.base-url': 'http://localhost:9998'
'neuroassist.pat.base-url': 'http://localhost:9997'
'neuroassist.acs.base-url': 'http://localhost:9996'
