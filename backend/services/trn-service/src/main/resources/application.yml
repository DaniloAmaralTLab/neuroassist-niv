spring:
  application:
    name: trn-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false  # Migrations gerenciadas pelo neuroassist-niv-migrations (V7+)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trn_dev}
    username: ${DB_USER:trn}
    password: ${DB_PASS:trn_dev_pass}
    hikari:
      maximum-pool-size: 10
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/neuroassist-niv}

server:
  port: 8089
  # Folga acima do teto do gateway (16KB): o gateway e o Feign acrescentam cabecalhos ao
  # Authorization do usuario. O default do Tomcat (8KB) responde 400 HTML a JWT grande.
  max-http-request-header-size: 24KB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{correlationId}] [%X{tenantId}] [%X{userId}] %logger{36} - %msg%n"
  level:
    com.neuroassist.trn: INFO

# Feign base URLs (D-533) — test profile overrides these with stub values
neuroassist:
  pat:
    base-url: ${PAT_BASE_URL:http://localhost:8082}
  hist:
    base-url: ${HIST_BASE_URL:http://localhost:8083}
  conv:
    base-url: ${CONV_BASE_URL:http://localhost:8085}
