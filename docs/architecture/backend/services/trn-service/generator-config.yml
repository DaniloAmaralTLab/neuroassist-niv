service: trn-service
type: standard
port: 8089
issue_prefix: TRN
base_path: /trn
package: com.neuroassist.trn

domain:
  aggregates:
    - TrainingSession
    - ConsentRecord
    - VoiceModel
    - Publication
  entities:
    - Proposal
    - Authorization
    - VoiceSample
    - AudioAsset
    - OutboundJob

# D-642: endpoints reachable WITHOUT a token (SecurityConfig permitAll).
# TRN has NO anonymous surface other than health. A patient-session token is rejected 403 on
# every /trn endpoint (ACS INV-3, ADR-002), so it is NOT public -> public_operations omitted.
public_paths:
  - GET /trn/health

application_services:
  - name: SessionService
    path: /sessions
    resource: session
    operations:
      - create     # -> trn.session.create
      - get        # -> trn.session.read   (D-639: read is an action, not an op verb)
  - name: ProposalService
    path: /proposals
    resource: proposal
    operations:
      - get        # -> trn.proposal.read
      - update     # -> trn.proposal.update   (dialog refine + withdraw = transition; 'withdraw' is NOT a verb -> update)
      - approve    # -> trn.proposal.approve  (caregiver-confirmation + patient-assent domain fact, ADR-002)
      - reject     # -> trn.proposal.reject
  - name: PublicationService
    path: /publications
    resource: publication
    operations:
      - create     # -> trn.publication.create  (synthesize + index + publish, async durable-retry)
      - get        # -> trn.publication.read
  - name: ConsentService
    path: /consents
    resource: consent
    operations:
      - create     # -> trn.consent.create
      - get        # -> trn.consent.read
      - revoke     # -> trn.consent.revoke
  - name: ErasureService
    path: /content
    resource: content
    operations:
      - delete     # -> trn.content.delete   (right-to-be-forgotten: crypto-shred + CONV retire/erase)

# Derived authorities (D-639/D-640/D-641 — <base>.<resource>.<action>, English verb table only):
#   trn.session.create      (create)
#   trn.session.read        (get     -> read)
#   trn.proposal.read       (get     -> read)
#   trn.proposal.update     (update; also governs withdraw = transition)
#   trn.proposal.approve    (approve; both dual-auth halves, ADR-002)
#   trn.proposal.reject     (reject)
#   trn.publication.create  (create)
#   trn.publication.read    (get     -> read)
#   trn.consent.create      (create)
#   trn.consent.read        (get     -> read)
#   trn.consent.revoke      (revoke)
#   trn.content.delete      (delete)
# Patient/guardian assent is a DOMAIN FACT, not a trn.* authority (ACS INV-3 intact, ADR-002).
# Service-client token held by TRN (minted by ACS, NOT seeded here): conv.tree.publish,
# conv.tree-version.retire, conv.audio.delete, hist.audit.record, pat.patient.read (INT-TRN-1).

enums:
  SessionStatus:
    - open
    - closed
  ProposalType:
    - category
    - phrase
  ProposalState:
    - draft
    - proposed
    - caregiver_approved
    - patient_approved
    - approved
    - synthesizing
    - indexed
    - published
    - rejected
    - withdrawn
    - erased
  ConsentStatus:
    - granted
    - revoked
  VoiceModelStatus:
    - active
    - erased
  AudioAssetStatus:
    - available
    - erased
  PublicationStatus:
    - pending
    - published
    - failed
  JobType:
    - synthesize
    - index
    - publish
    - retire
    - erase_conv_audio
    - audit
  JobStatus:
    - pending
    - in_progress
    - done
    - failed

feign_clients:
  - name: PatClient
    service: pat-service
    url_prop: neuroassist.pat.base-url
  - name: HistClient
    service: hist-service
    url_prop: neuroassist.hist.base-url
  - name: ConvClient
    service: conv-service
    url_prop: neuroassist.conv.base-url

consumed_events: []

events:
  published: []

# Outbound ports = hexagonal interfaces NOT backed by a JPA repository adapter (external vendors +
# cross-service feign). Repository ports for TrainingSession/Proposal/ConsentRecord/VoiceModel/
# VoiceSample/AudioAsset/Publication/OutboundJob are generated by the entity generator — listing
# them here would create duplicate stub adapters (CONV lesson), so they are intentionally omitted.
outbound_ports:
  - LlmDialogPort          # Anthropic Claude (ADR-004)
  - TtsPort                # ElevenLabs (ADR-005)
  - SearchIndexPort        # Elasticsearch, approved-only authoring-side (ADR-006)
  - TreePublicationPort    # CONV publish/retire/erase (ConvClient adapter)
  - PatientReferencePort   # PAT read (PatClient adapter)
  - AuditPort              # HIST audit (HistClient adapter)
